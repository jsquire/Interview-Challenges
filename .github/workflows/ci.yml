name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - challenges/longest-palindrome/src/csharp/LongestPalindrome.slnx
          - challenges/minimum-coin-change/src/csharp/MinimumCoinChallenge.sln
          - challenges/conway-life/src/csharp/ConwayLifeChallenge.slnx

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ matrix.solution }} --configuration Release --no-build
