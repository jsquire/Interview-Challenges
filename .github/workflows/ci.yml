name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - challenges/longest-palindrome/src/csharp/LongestPalindrome.slnx
          - challenges/minimum-coin-change/src/csharp/MinimumCoinChallenge.sln
          - challenges/conway-life/src/csharp/ConwayLifeChallenge.slnx

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ matrix.solution }} --configuration Release --no-build
